name: Publish Docker image

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/krmaryum/urdu-dub-studio
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the release Compose file
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Use a tag such as v0.1.0." >&2
            exit 1
          }
          mkdir -p release
          grep -qx '    build: \.' compose.yaml
          sed "s|^    build: \.$|    image: ${IMAGE}:${GITHUB_REF_NAME}|" compose.yaml > release/compose.yaml
          docker compose -f release/compose.yaml config --quiet
          docker compose -f release/compose.yaml config --images | grep -Fx "${IMAGE}:${GITHUB_REF_NAME}"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Sign in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish the x86-64 and ARM64 image
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --tag "${IMAGE}:${GITHUB_REF_NAME}" --push .
          docker buildx imagetools inspect "${IMAGE}:${GITHUB_REF_NAME}"
      - name: Attach Compose file to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/compose.yaml --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/compose.yaml --verify-tag --generate-notes
          fi
